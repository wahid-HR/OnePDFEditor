<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Soft Shadow & App Base -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="10"/>
  
  <!-- Big "ONE" in Dark Green -->
  <text x="50%" y="265" font-family="'Segoe UI', 'Arial Black', sans-serif" font-weight="900" font-size="165" fill="#1B4D3E" text-anchor="middle" letter-spacing="-4">ONE</text>
  
  <!-- Blue "PDF" Badge Inside "ONE" -->
  <g transform="translate(256, 350)">
    <rect x="-105" y="-42" width="210" height="64" rx="20" fill="#0066FF"/>
    <text x="0" y="5" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="38" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">PDF</text>
  </g>
</svg>
